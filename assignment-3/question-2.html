<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Product Catalog</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Availability</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>A high-performance laptop with a 15-inch display.</td>
                <td>$999</td>
                <td>In Stock</td>
                <td><img src="https://via.placeholder.com/100" alt="Laptop"></td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>An ergonomic mouse with customizable buttons.</td>
                <td>$49</td>
                <td>In Stock</td>
                <td><img src="https://via.placeholder.com/100" alt="Mouse"></td>
            </tr>
            <tr>
                <td colspan="5">Special Offer: Bundle and save 10%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
