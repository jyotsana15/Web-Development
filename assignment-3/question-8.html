<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>
    <h1>ABC School</h1>
    <h2>Student Report Card</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Math</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>85</td>
            </tr>
            <tr>
                <td>English</td>
                <td>88</td>
            </tr>
            <tr>
                <td>History</td>
                <td>82</td>
            </tr>
            <tr>
                <td>Geography</td>
                <td>87</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td title="Total Marks">Total</td>
                <td>432</td>
            </tr>
            <tr>
                <td title="Percentage">Percentage</td>
                <td>86.4%</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
