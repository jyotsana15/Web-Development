<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="tooltip.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>
        <div class="tooltip-container">
            <span class="tooltip-trigger">Hover over me
                <span class="tooltip">This is a simple tooltip!</span>
            </span>
        </div>

        <div class="tooltip-container">
            <span class="tooltip-trigger">Another example
                <span class="tooltip">Tooltips can contain <strong>HTML</strong> content.</span>
            </span>
        </div>

        <div class="tooltip-container">
            <img src="https://via.placeholder.com/50" alt="Icon" class="tooltip-trigger">
            <span class="tooltip">This tooltip is for an icon.</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 CSS Tooltips. All rights reserved.</p>
    </footer>
</body>
</html>
