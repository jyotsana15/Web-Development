<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <div class="image-grid">
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 1">
                <figcaption>Caption for Image 1</figcaption>
            </figure>
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 2">
                <figcaption>Caption for Image 2</figcaption>
            </figure>
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 3">
                <figcaption>Caption for Image 3</figcaption>
            </figure>
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 4">
                <figcaption>Caption for Image 4</figcaption>
            </figure>
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 5">
                <figcaption>Caption for Image 5</figcaption>
            </figure>
            <figure class="image-item">
                <img src="https://via.placeholder.com/300x200" alt="Showcase Image 6">
                <figcaption>Caption for Image 6</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Image Showcase. All rights reserved.</p>
    </footer>
</body>
</html>
