<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question-8.css">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Choose Your Plan</h2>
        <div class="row">
            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card text-center pricing-card">
                    <div class="card-header">
                        Basic
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">$9.99/month</h5>
                        <ul class="list-unstyled">
                            <li>10 GB Storage</li>
                            <li>1 User</li>
                            <li>Email Support</li>
                        </ul>
                        <a href="#" class="btn btn-outline-primary">Select</a>
                    </div>
                </div>
            </div>
            <!-- Pro Plan -->
            <div class="col-md-4">
                <div class="card text-center pricing-card bg-primary text-white shadow-lg">
                    <div class="card-header">
                        Pro
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">$19.99/month</h5>
                        <ul class="list-unstyled">
                            <li>50 GB Storage</li>
                            <li>5 Users</li>
                            <li>Phone & Email Support</li>
                        </ul>
                        <a href="#" class="btn btn-light">Select</a>
                    </div>
                </div>
            </div>
            <!-- Enterprise Plan -->
            <div class="col-md-4">
                <div class="card text-center pricing-card">
                    <div class="card-header">
                        Enterprise
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">$49.99/month</h5>
                        <ul class="list-unstyled">
                            <li>100 GB Storage</li>
                            <li>Unlimited Users</li>
                            <li>24/7 Support</li>
                        </ul>
                        <a href="#" class="btn btn-outline-primary">Select</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
