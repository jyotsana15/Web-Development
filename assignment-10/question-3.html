<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question-3.css">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Our Products</h2>
        <div class="row">
            <!-- Product 1 -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card h-100 shadow-sm product-card">

                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">$99.99</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1999&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="card-img-top" alt="Product 2">
                    <div class="card-body">
                        <h5 class="card-title">Watch</h5>
                        <p class="card-text">$149.99</p>

                    </div>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="card-img-top" alt="Product 3">
                    <div class="card-body">
                        <h5 class="card-title">Running Shoes</h5>
                        <p class="card-text">$79.99</p>

                    </div>
                </div>
            </div>
            <!-- Product 4 -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="card-img-top" alt="Product 4">
                    <div class="card-body">
                        <h5 class="card-title">Camera</h5>
                        <p class="card-text">$399.99</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
