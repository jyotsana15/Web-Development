<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question-6.css">
</head>
<body>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                Notifications
            </div>
            <div class="card-body">
                <!-- Dismissible Alert -->
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>New Message!</strong> You have a new message from John Doe.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Info Alert -->
                <div class="alert alert-info" role="alert">
                    <strong>Tip of the day:</strong> Use Bootstrap to build responsive websites quickly.
                </div>

                <!-- Danger Alert -->
                <div class="alert alert-danger" role="alert">
                    <strong>Warning!</strong> Your subscription is about to expire.
                </div>

                <!-- Summary Well -->
                <div class="summary-well bg-light p-3 border rounded">
                    <h5>Summary</h5>
                    <p>You have 3 new notifications.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
