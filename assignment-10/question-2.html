<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question-2.css">
</head>
<body class="bg-light">

    <div class="container text-center p-5 mt-4 mb-3">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="fw-bold">Jyotsana Bhardwaj</h1>
            <p class="text-muted">Full Stack Developer & Designer</p>
        </header>

        <!-- Profile Image -->
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Profile Image" class="img-fluid rounded-circle mb-4" width="200">

        <!-- Action Buttons -->
        <div class="mb-4">
            <a href="#" class="btn btn-primary">Hire Me</a>
            <a href="#" class="btn btn-secondary">Download CV</a>
        </div>

        <!-- Contact Form -->
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="3" placeholder="Your message"></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark">Contact Me</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
