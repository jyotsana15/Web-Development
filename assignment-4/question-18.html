<body>
    <h1>Quotations</h1>
    <blockquote>
        This is a long quotation. It can span multiple lines and is typically indented.
        It can contain entities like &amp; and &lt;.
    </blockquote>
    <p>
        This is a paragraph with a short quotation: <q>This is a short quote.</q>
    </p>
