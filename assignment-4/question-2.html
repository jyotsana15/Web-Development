<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2: Google Maps Iframe</title>
</head>
<body>
    <!-- 
        The loading="lazy" attribute on an iframe tells the browser to load the iframe only when it is close to being visible in the viewport. 
        This can help to improve the performance of the page by reducing the initial page load time.
    -->
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387191.3375034662!2d-74.2598654844731!3d40.697149419442!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24fa5d33f083b%3A0xc80b8f06e177fe62!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sin!4v1678886312345!5m2!1sen!2sin" 
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        title="Google Map of New York City">
    </iframe>
</body>
</html>
