<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7: Login Form</title>
</head>
<body>
    <h1>Login Form</h1>
    <form action="#">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- 
            A CSRF (Cross-Site Request Forgery) token is a unique, secret, unpredictable value that is generated by the server-side application and transmitted to the client in a hidden field. 
            The client then includes that token with each subsequent request. This allows the server to verify that the request is coming from the original user and not a malicious third party.
        -->
        <input type="hidden" name="csrf_token" value="abcdef123456">

        <input type="submit" value="Login">
    </form>
</body>
</html>
