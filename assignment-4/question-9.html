<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9: File Upload Form</title>
</head>
<body>
    <h1>File Upload Form</h1>
    <form action="#">
        <label for="file_upload">Select a file to upload:</label><br>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png"><br><br>
        <p>Please upload only .jpg or .png files.</p>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
