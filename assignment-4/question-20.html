<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The <title> tag specifies the title of the document, which is shown in the browser's title bar or tab. -->
    <title>Question 20: Important Head Elements</title>

    <!-- The <meta> tag provides metadata about the HTML document. -->
    <meta charset="UTF-8"> <!-- Specifies the character encoding for the document. -->
    <meta name="description" content="This page demonstrates important head elements."> <!-- Provides a description of the page. -->
    <meta name="author" content="Jyotsana Bhardwaj"> <!-- Specifies the author of the page. -->

    <!-- The <base> tag specifies the base URL for all relative URLs in a document. -->
    <base href="https://www.example.com/">

    <!-- The <link> tag defines a link between a document and an external resource. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Specifies a favicon for the page. -->

    <!-- The <style> tag is used to define style information (CSS) for a document. -->
    <style>
        /* This is an empty style block. */
    </style>

    <!-- The <script> tag is used to embed a client-side script (JavaScript). -->
    <script>
        // This is an empty script block.
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page includes various important elements in the head section. Check the source code to see them.</p>
</body>
</html>
