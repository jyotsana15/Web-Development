<body>
    <p>
        This paragraph demonstrates the use of HTML entities.<br>
        Less than: &lt;<br>
        Greater than: &gt;<br>
        Ampersand: &amp;<br>
        Double quote: &quot;<br>
        Single quote: &apos;<br>
        Copyright: &copy;<br>
        Trademark: &trade;<br>
        Registered Trademark: &reg;<br>
    </p>
