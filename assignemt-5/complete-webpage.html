<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Webpage</title>
    <link rel="stylesheet" href="complete-webpage.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero">
        <div class="hero-content">
            <h1>Welcome to Our Website</h1>
        </div>
    </section>

    <section id="about">
        <div class="about-content">
            <div class="about-text">
                <h2>About Us</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. ...</p>
            </div>
            <div class="about-image">
                <img src="https://via.placeholder.com/300" alt="About Us Image">
            </div>
        </div>
    </section>

    <section id="services">
        <h2>Our Services</h2>
        <div class="service-boxes">
            <div class="service-box">Service 1</div>
            <div class="service-box">Service 2</div>
            <div class="service-box">Service 3</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea placeholder="Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Complete Webpage</p>
    </footer>
</body>
</html>
