<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="pricing.css">
</head>
<body>
    <section class="pricing-table">
        <div class="pricing-plan">
            <h2>Basic</h2>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
            <p class="price">$9.99/month</p>
            <a href="#" class="cta-button">Select Plan</a>
        </div>
        <div class="pricing-plan popular">
            <h2>Standard</h2>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
            </ul>
            <p class="price">$19.99/month</p>
            <a href="#" class="cta-button">Select Plan</a>
        </div>
        <div class="pricing-plan">
            <h2>Premium</h2>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
                <li>Feature 5</li>
            </ul>
            <p class="price">$29.99/month</p>
            <a href="#" class="cta-button">Select Plan</a>
        </div>
    </section>
</body>
</html>
