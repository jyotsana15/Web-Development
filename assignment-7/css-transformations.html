<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="css-transformations.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main>
        <div class="container">
            <div class="box rotate">
                <p>Rotate (45deg)</p>
            </div>
            <div class="box scale">
                <p>Scale (1.2)</p>
            </div>
            <div class="box translate">
                <p>Translate (50px, 20px)</p>
            </div>
            <div class="box skew">
                <p>Skew (20deg, 10deg)</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 CSS Transformations. All rights reserved.</p>
    </footer>
</body>
</html>
