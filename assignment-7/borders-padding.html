<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="borders-padding.css">
</head>
<body>
    <h1>Borders and Padding Demonstration</h1>
    <div class="container">
        <!-- Box 1: Solid Border, Rounded Corners, Padding -->
        <div class="box box-1">
            <p>This box has a solid border, rounded corners, and custom padding.</p>
        </div>

        <!-- Box 2: Dashed Border, Different Padding -->
        <div class="box box-2">
            <p>This box features a dashed border and different padding values.</p>
        </div>

        <!-- Box 3: Double Border, More Rounded Corners -->
        <div class="box box-3">
            <p>Here's a box with a double border and more pronounced rounded corners.</p>
        </div>

        <!-- Box 4: Groove Border, Specific Padding -->
        <div class="box box-4">
            <p>This box demonstrates a groove border with unique padding.</p>
        </div>
    </div>
</body>
</html>
