<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>
    <header>
        <h1>Filter Comparison</h1>
    </header>
    <main>
        <div class="comparison-container">
            <figure class="image-wrapper">
                <img src="https://via.placeholder.com/400" alt="Original image">
                <figcaption>Original</figcaption>
            </figure>
            <figure class="image-wrapper">
                <img src="https://via.placeholder.com/400" alt="Image with filter" class="filtered-image">
                <figcaption>With Filter</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Filter Comparison. All rights reserved.</p>
    </footer>
</body>
</html>
