<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>
    <main>
        <div class="image-gallery">
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with blur filter" class="filter-blur">
                <figcaption>Blur</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with grayscale filter" class="filter-grayscale">
                <figcaption>Grayscale</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with sepia filter" class="filter-sepia">
                <figcaption>Sepia</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with brightness filter" class="filter-brightness">
                <figcaption>Brightness</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with contrast filter" class="filter-contrast">
                <figcaption>Contrast</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://via.placeholder.com/300" alt="Image with hue-rotate filter" class="filter-hue-rotate">
                <figcaption>Hue-Rotate</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Image Filters. All rights reserved.</p>
    </footer>
</body>
</html>
